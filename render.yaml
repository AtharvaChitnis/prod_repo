# Render Blueprint. Set sync:false secrets in the dashboard before the first deploy.
# Deploy the API first, copy its public URL into VITE_API_URL and PUBLIC_API_URL, then deploy the web service.
services:
  - type: web
    name: quarry-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build -w @quarry/contracts && npm run build -w @quarry/api
    startCommand: npm run start -w @quarry/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: VECTOR_INDEX
        sync: false

  - type: web
    name: quarry-web
    runtime: static
    buildCommand: npm install && npm run build -w @quarry/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
